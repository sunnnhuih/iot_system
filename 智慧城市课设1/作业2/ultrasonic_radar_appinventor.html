<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超声波雷达显示</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 页面背景 */
        body {
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* 雷达容器 */
        .radar-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
        }
        
        /* 雷达屏幕 */
        .radar-screen {
            position: relative;
            width: 100%;
            height: 100%;
            border: 4px solid #00ff00;
            border-radius: 50%;
            background-color: #001100;
            overflow: hidden;
        }
        
        /* 同心圆标记 */
        .radar-circle {
            position: absolute;
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* 10cm标记 */
        .circle-10 {
            width: 100px;
            height: 100px;
        }
        
        /* 20cm标记 */
        .circle-20 {
            width: 200px;
            height: 200px;
        }
        
        /* 30cm标记 */
        .circle-30 {
            width: 300px;
            height: 300px;
        }
        
        /* 扫描线 */
        .scan-line {
            position: absolute;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff00, transparent);
            top: 50%;
            left: 0;
            transform-origin: right center;
            animation: scan 3s linear infinite;
        }
        
        /* 扫描动画 */
        @keyframes scan {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        /* 目标点 */
        .target {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        
        /* 目标点脉冲动画 */
        .target.pulse {
            opacity: 1;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 0, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
            }
        }
        
        /* 数据显示区域 */
        .data-display {
            text-align: center;
            color: #00ff00;
        }
        
        /* 距离数值 */
        .distance-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        /* 状态文本 */
        .status-text {
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        /* 响应式设计 */
        @media (max-width: 480px) {
            .radar-container {
                width: 250px;
                height: 250px;
            }
            
            .circle-10 {
                width: 83px;
                height: 83px;
            }
            
            .circle-20 {
                width: 166px;
                height: 166px;
            }
            
            .circle-30 {
                width: 250px;
                height: 250px;
            }
            
            .distance-value {
                font-size: 28px;
            }
            
            .status-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="radar-container">
        <div class="radar-screen">
            <!-- 同心圆标记 -->
            <div class="radar-circle circle-10"></div>
            <div class="radar-circle circle-20"></div>
            <div class="radar-circle circle-30"></div>
            
            <!-- 扫描线 -->
            <div class="scan-line"></div>
            
            <!-- 目标点 -->
            <div class="target" id="target"></div>
        </div>
    </div>
    
    <div class="data-display">
        <div class="distance-value" id="distance-value">0</div>
        <div class="status-text" id="status-text">无目标</div>
    </div>

    <script>
        // 全局变量
        let currentDistance = 0;
        
        // 初始化函数
        function init() {
            // 尝试在App Inventor环境中运行
            if (typeof window.AppInventor !== 'undefined' && window.AppInventor.getWebViewString) {
                console.log('在App Inventor环境中运行');
                // 每秒读取WebViewString更新数据
                setInterval(readWebViewString, 1000);
            } else {
                // 不在App Inventor环境中，使用模拟数据
                console.log('使用模拟数据');
                setupSimulation();
            }
        }
        
        // 从App Inventor读取WebViewString
        function readWebViewString() {
            try {
                // 获取WebViewString
                let webViewString = window.AppInventor.getWebViewString();
                
                if (webViewString) {
                    // 解析JSON数据
                    let data = JSON.parse(webViewString);
                    
                    if (data && data.distance !== undefined) {
                        updateRadar(data.distance);
                    }
                }
            } catch (e) {
                console.error('读取WebViewString时出错:', e);
            }
        }
        
        // 设置模拟数据
        function setupSimulation() {
            // 模拟距离数据变化
            setInterval(function() {
                // 随机生成0-30cm的距离
                const simulatedDistance = Math.floor(Math.random() * 31);
                updateRadar(simulatedDistance);
            }, 2000);
        }
        
        // 更新雷达显示
        function updateRadar(distance) {
            try {
                // 确保距离是数字
                currentDistance = parseFloat(distance);
                
                // 更新距离数值显示
                document.getElementById('distance-value').textContent = currentDistance + ' cm';
                
                // 更新状态文本
                const statusText = document.getElementById('status-text');
                if (currentDistance > 0 && currentDistance <= 30) {
                    statusText.textContent = '检测到目标';
                } else {
                    statusText.textContent = '无目标';
                }
                
                // 更新目标点位置
                const target = document.getElementById('target');
                if (currentDistance > 0 && currentDistance <= 30) {
                    // 计算目标点位置（最大半径为150px，对应30cm）
                    const radius = (currentDistance / 30) * 150;
                    // 随机角度（0-360度）
                    const angle = Math.random() * Math.PI * 2;
                    // 计算x和y坐标
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    
                    // 设置目标点位置
                    target.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                    // 添加脉冲动画
                    target.classList.add('pulse');
                } else {
                    // 无目标时隐藏目标点
                    target.classList.remove('pulse');
                }
                
            } catch (e) {
                console.error('更新雷达显示时出错:', e);
            }
        }
        
        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
