<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智慧城市控制台</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><header><div><h1>智慧城市控制台</h1><p id="connection">正在连接网关</p></div><span id="mode">自动模式</span></header>
<section class="metrics"><article><span>温度</span><strong id="temperature">--</strong><small>°C</small></article><article><span>湿度</span><strong id="humidity">--</strong><small>%RH</small></article><article><span>烟雾</span><strong id="smoke">--</strong></article><article><span>光照</span><strong id="light">--</strong></article><article><span>人体红外</span><strong id="human">--</strong></article></section>
<section class="panel"><h2>设备控制</h2><div class="controls"><button data-target="MODE" data-value="0">切换手动</button><button data-target="MODE" data-value="1">恢复自动</button><button data-target="RELAY" data-value="1">开路灯</button><button data-target="RELAY" data-value="0">关路灯</button><button data-target="BUZZER" data-value="1">开蜂鸣器</button><button data-target="BUZZER" data-value="0">关蜂鸣器</button><button data-target="LED" data-value="1">开警示灯</button><button data-target="LED" data-value="0">关警示灯</button></div><p id="control-result"></p></section>
<section class="panel"><h2>Agent 对话控制</h2><div id="chat" class="chat"></div><form id="agent-form"><input id="agent-message" placeholder="例如：切换手动模式后打开路灯" autocomplete="off"><button>发送</button></form></section><section class="panel"><h2>最近事件</h2><ul id="events"></ul></section></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
